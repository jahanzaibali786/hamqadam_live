name: Phase 7 Laravel Validation

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  php-and-blade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, gd, zip, sqlite3, pdo_sqlite, bcmath
          tools: composer:v2
          coverage: none
      - name: Lint PHP source files
        run: |
          set -euo pipefail
          find app routes config database/migrations tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/phase7-php-lint.log
          tail -n 12 /tmp/phase7-php-lint.log
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
      - name: Blade view compilation
        run: php artisan view:cache
      - name: Phase-specific contract tests
        run: php artisan test --filter='CompletionGuardTest|DashboardBladeCompilationTest|PremiumPolicyTest|PaymentRefundExecutionGuardTest'
