name: Phase 7 Laravel Validation

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

jobs:
  php-and-blade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, gd, zip, sqlite3, pdo_sqlite, bcmath
          tools: composer:v2
          coverage: none
      - name: Lint PHP source files
        run: |
          set -euo pipefail
          find app routes config database/migrations tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/phase7-php-lint.log
          tail -n 12 /tmp/phase7-php-lint.log
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs
          chmod -R ug+rwX bootstrap/cache storage/framework
      - name: Configure test environment before Composer scripts
        run: |
          cp .env.example .env
          php -r '$p=".env"; $s=file_get_contents($p); $s=preg_replace("/^DB_CONNECTION=.*$/m", "DB_CONNECTION=sqlite", $s); $s=preg_replace("/^DB_DATABASE=.*$/m", "DB_DATABASE=:memory:", $s); file_put_contents($p, $s);'
          printf '\nAPP_ENV=testing\nCACHE_STORE=array\nSESSION_DRIVER=array\nMAIL_MAILER=array\n' >> .env
      - name: Composer install
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel application
        run: |
          php artisan key:generate
          php artisan optimize:clear
      - name: Blade view compilation
        run: php artisan view:cache
      - name: Phase-specific contract tests
        run: php artisan test --filter='CompletionGuardTest|DashboardBladeCompilationTest|PremiumPolicyTest|PaymentRefundExecutionGuardTest|PaymentAuditRouteTest|MemberBillingAndRefundRoutesTest|Phase8RouteContractsTest|Phase9QualityContractsTest|RequirementClosureContractsTest'
