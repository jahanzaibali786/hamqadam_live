name: Fast Laravel Deploy via SSH

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      ###########################################################
      # Checkout Repository
      ###########################################################
      - name: Checkout Repository
        uses: actions/checkout@v5

      ###########################################################
      # Deploy only changed files over SSH.
      # Required secrets: SSH_PRIVATE_KEY and SSH_USER.
      # Optional secrets: SSH_HOST, SSH_PORT, SSH_DEPLOY_PATH.
      ###########################################################
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH and rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || 'hamqadam.com' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH || '/home/hamqadam.com/public_html' }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_USER" ]; then
            echo "SSH_USER secret is required"
            exit 1
          fi

          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"

          rsync -az --whole-file --partial --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -p $SSH_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.env_*' \
            --exclude='.freebuff/' \
            --exclude='.devin/' \
            --exclude='_call_bundle/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/testing/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/app/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='public/uploads/' \
            --exclude='tests/' \
            --exclude='*.zip' \
            --exclude='*.sql' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan optimize:clear"
      ###########################################################
      # Done
      ###########################################################
      - name: Deployment Complete
        run: echo "✅ Deployment completed successfully."
