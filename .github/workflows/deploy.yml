name: Deploy Hamqadam to Live

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamqadam-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync project over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || 'hamqadam.com' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH || '/home/hamqadam.com/public_html' }}

    steps:
      - name: Checkout revision
        uses: actions/checkout@v4

      - name: Validate deployable PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find app routes config database/migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 12 /tmp/php-lint.log

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify live SSH target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_USER" || { echo 'SSH_USER secret is required'; exit 1; }
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -T -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && printf 'SSH target ready: %s\\n' '$DEPLOY_PATH'"

      - name: Sync repository to live
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete-delay --partial --omit-dir-times \
            --no-perms --no-owner --no-group --itemize-changes --stats \
            -e "ssh -T -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=15" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.env_*' \
            --exclude='.freebuff/' \
            --exclude='.devin/' \
            --exclude='_call_bundle/' \
            --exclude='.deploy-commit' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/testing/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/app/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='public/uploads/' \
            --exclude='tests/' \
            --exclude='*.zip' \
            --exclude='*.sql' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Clear live caches and record deployed revision
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && php artisan optimize:clear && printf '%s\\n' '${GITHUB_SHA}' > .deploy-commit && printf 'Live revision: ' && cat .deploy-commit"

      - name: Deployment complete
        run: echo "Live deployment completed for ${GITHUB_SHA}."
